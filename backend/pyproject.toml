[project]
name = "prinmap-backend"
version = "0.1.0"
description = "Urban Fabric Generator backend — procedural urban morphology from OSM roads"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "shapely>=2.0",
    "pyproj>=3.6",
    "requests>=2.31",
    "numpy>=1.26",
    "mapbox-earcut>=1.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
